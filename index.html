<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff4d8d" />
    <meta name="description" content="文化祭の企画一覧・タイムテーブル・待ち時間を確認できる『まちたいむ』" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="まちたいむ" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <title>まちたいむ | 文化祭ガイド</title>
    <script>
      // 夜間モード/文字拡大の設定をReact描画より前に適用し、切り替わりのチラつき(FOUC)を防ぐ。
      // ロジックはsrc/components/ui.tsxのuseTheme/useTextScaleと同じ判定にしてある。
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem("machitime:v6:theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = theme === "dark" || (theme !== "light" && prefersDark);
          if (dark) root.classList.add("dark");
          if (localStorage.getItem("machitime:v6:textScale") === "1") root.classList.add("text-lg-mode");
        } catch (e) { /* ローカルストレージが使えない場合は既定表示のまま */ }
      })();
    </script>
  </head>
  <body>
    <noscript>このアプリを利用するにはJavaScriptを有効にしてください。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
